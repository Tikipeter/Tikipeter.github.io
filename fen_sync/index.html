<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FenSync Pairing</title>
    <style>
        :root {
            --bg-color: #131921;
            --card-bg: #1c2430;
            --text-primary: #ffffff;
            --text-secondary: #909bb0;
            --border-color: #2b374a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 320px;
            width: 100%;
        }
        h1 { 
            font-size: 1.6rem; 
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 0.5rem; 
            letter-spacing: -0.5px;
        }
        p { 
            color: var(--text-secondary); 
            margin-bottom: 2.5rem; 
            font-size: 0.95rem; 
            line-height: 1.4;
        }
        .code-display {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .btn {
            background-color: var(--text-primary);
            color: var(--bg-color);
            border: none;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: opacity 0.2s, background-color 0.2s;
        }
        .btn:hover { 
            opacity: 0.9; 
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>FenSync Pairing</h1>
        <p>Your authentication code is ready.<br>Tap below to copy it.</p>
        <div id="pairing-code" class="code-display">------</div>
        <button class="btn" onclick="copyCode()">Copy Code</button>
    </div>

    <script>
        // Robust parameter extraction handling trailing slashes or clean URLs
        const searchParams = window.location.search;
        const urlParams = new URLSearchParams(searchParams);
        let userCode = urlParams.get('code');

        // Fallback check if URL structure parsing was disrupted by the slash
        if (!userCode) {
            const match = window.location.href.match(/[?&]code=([^&#]*)/);
            userCode = match ? match[1] : '000000';
        }
        
        document.getElementById('pairing-code').innerText = userCode;

        function copyCode() {
            navigator.clipboard.writeText(userCode);
            const btn = document.querySelector('.btn');
            btn.innerText = 'Copied!';
            btn.style.backgroundColor = '#2ecc71'; 
            btn.style.color = '#ffffff';
            setTimeout(() => {
                btn.innerText = 'Copy Code';
                // Fixed JavaScript crash by using valid color string variables
                btn.style.backgroundColor = '#ffffff';
                btn.style.color = '#131921';
            }, 2000);
        }
    </script>
</body>
</html>
