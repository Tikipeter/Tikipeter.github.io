<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FenSync Pairing</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 320px;
            width: 100%;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }
        .code-display {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: var(--accent-color);
            background: rgba(59, 130, 246, 0.1);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background-color: var(--accent-hover); }
    </style>
</head>
<body>

    <div class="card">
        <h1>FenSync Pairing</h1>
        <p>Your authentication code is ready. Tap below to copy it.</p>
        <div id="pairing-code" class="code-display">------</div>
        <button class="btn" onclick="copyCode()">Copy Code</button>
    </div>

    <script>
        // 1. Automatically grab the 6-digit code from the URL parameter (?code=XXXXXX)
        const urlParams = new URLSearchParams(window.location.search);
        const userCode = urlParams.get('code') || '000000';
        
        // 2. Inject it into the HTML card
        document.getElementById('pairing-code').innerText = userCode;

        // 3. Handle the clipboard copy feature
        function copyCode() {
            navigator.clipboard.writeText(userCode);
            const btn = document.querySelector('.btn');
            btn.innerText = 'Copied!';
            btn.style.backgroundColor = '#10b981'; // Turn green on success
            setTimeout(() => {
                btn.innerText = 'Copy Code';
                btn.style.backgroundColor = '#3b82f6';
            }, 2000);
        }
    </script>
</body>
</html>
